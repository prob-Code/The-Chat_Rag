name: Deploy to AWS Lambda

# Image GitHub ke runner pe banti hai, tumhare laptop pe nahi.
# Fayda: local Docker aur local AWS CLI dono ki zaroorat khatam,
# aur runner khud linux/amd64 hai toh --platform ka jhamela bhi nahi.
#
# EK BAAR KA SETUP — repo Settings > Secrets and variables > Actions
# me do secrets daalo:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
# (wahi keys jo raggita-deploy IAM user ki banayi thi)

on:
  workflow_dispatch:          # Actions tab se manually "Run workflow"
  push:
    branches: [main]
    paths:
      - 'api.py'
      - 'rag_core/**'
      - 'static/**'
      - 'gita_vector_db/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy_lambda.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPO: raggita
  FUNCTION_NAME: raggita

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null
          echo "ECR repo ready: $ECR_REPO"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"
          echo "Pushed: $IMAGE"

      - name: Update Lambda function (agar pehle se bani hai)
        run: |
          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "Lambda function updated."
          else
            echo "-------------------------------------------------------"
            echo "Lambda function abhi nahi bani hai. Image taiyar hai."
            echo ""
            echo "Console me jao: Lambda > Create function > Container image"
            echo "Image URI yeh daalna:"
            echo ""
            echo "  $IMAGE_URI"
            echo ""
            echo "Uske baad har push pe yeh workflow function ko"
            echo "apne aap update karta rahega."
            echo "-------------------------------------------------------"
          fi

      - name: Summary
        run: |
          echo "### RagGita image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
