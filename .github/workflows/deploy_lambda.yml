
name: Deploy to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api.py'
      - 'rag_core/**'
      - 'static/**'
      - 'gita_vector_db/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy_lambda.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPO: raggita
  FUNCTION_NAME: raggita

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::AWS_ACCESS_KEY_ID GitHub secret is missing"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::AWS_SECRET_ACCESS_KEY GitHub secret is missing"; exit 1; }
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN GitHub secret is missing"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPO" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository \
              --repository-name "$ECR_REPO" \
              --region "$AWS_REGION" >/dev/null
          echo "ECR repo ready: $ECR_REPO"

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:$GITHUB_SHA"
          LATEST="$REGISTRY/$ECR_REPO:latest"
          docker build --platform linux/amd64 -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "IMAGE_URI=$IMAGE" >> "$GITHUB_ENV"
          echo "Pushed: $IMAGE"

      - name: Update Lambda function if it already exists
        run: |
          if aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri "$IMAGE_URI" \
              --region "$AWS_REGION" >/dev/null
            aws lambda wait function-updated \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION"
            echo "Lambda function updated."

            # Preserve existing variables (Firebase, DynamoDB, etc.) while
            # enforcing the authenticated remote embedding settings.
            CURRENT_ENV=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION" \
              --query 'Environment.Variables' \
              --output json)
            if [ "$CURRENT_ENV" = "null" ]; then CURRENT_ENV='{}'; fi
            UPDATED_ENV=$(printf '%s' "$CURRENT_ENV" | jq -c \
              --arg openai_key "${OPENAI_API_KEY:-}" \
              --arg hf_token "$HF_TOKEN" \
              '. + {USE_REMOTE_EMBEDDINGS:"true",HF_TOKEN:$hf_token} | if $openai_key != "" then . + {OPENAI_API_KEY:$openai_key,OPENAI_API_BASE:"https://api.openai.com/v1",LLM_MODEL:"gpt-4o-mini"} else . end')
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --environment "{\"Variables\":$UPDATED_ENV}" \
              --region "$AWS_REGION" >/dev/null

            if [ -n "${OPENAI_API_KEY:-}" ]; then
              echo "Updated Lambda LLM configuration from OPENAI_API_KEY secret."
            else
              echo "OPENAI_API_KEY secret not set; preserved the existing Lambda value."
            fi

            if aws lambda get-function-url-config \
              --function-name "$FUNCTION_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              aws lambda update-function-url-config \
                --function-name "$FUNCTION_NAME" \
                --auth-type NONE \
                --invoke-mode RESPONSE_STREAM \
                --region "$AWS_REGION" >/dev/null
            fi
          else
            echo "-------------------------------------------------------"
            echo "Lambda function not created yet. Image is ready."
            echo ""
            echo "Console: Lambda > Create function > Container image"
            echo "Image URI:"
            echo ""
            echo "  $IMAGE_URI"
            echo ""
            echo "After that, every push updates the function automatically."
            echo "-------------------------------------------------------"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Summary
        run: |
          echo "### RagGita image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
