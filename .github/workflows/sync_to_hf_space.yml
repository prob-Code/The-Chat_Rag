name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Check Hugging Face token
        id: hf_token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        if: steps.hf_token.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: AgentCrafter/RAg_gita
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space

      - name: Skip Hugging Face sync when no token is configured
        if: steps.hf_token.outputs.configured == 'false'
        run: echo "HF_TOKEN is not configured; skipping Hugging Face sync."

